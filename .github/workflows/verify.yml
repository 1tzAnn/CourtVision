name: Verify Courtvision
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: courtvision-verified-app
          path: |
            CourtVisionAI_Standalone.html
            docs/release-check.json
